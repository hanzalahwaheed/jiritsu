<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Distraction Gate — Settings</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --border:#262b36; --text:#e6e8eb;
            --muted:#9aa3b2; --accent:#ff4500; --green:#2ec27e; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); padding:40px 20px;
           font:15px/1.55 -apple-system, system-ui, sans-serif; }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    label { display:block; font-weight:600; margin: 18px 0 6px; }
    .hint { color: var(--muted); font-weight: 400; font-size: 13px; }
    textarea, input {
      width:100%; background:#0c0e12; color:var(--text); border:1px solid var(--border);
      border-radius:8px; padding:12px 14px; font-size:14px;
      font-family:"SF Mono", ui-monospace, Menlo, monospace;
    }
    textarea { min-height: 160px; resize: vertical; }
    input[type=number] { width: 120px; }
    .row { display:flex; align-items:center; gap:12px; }
    button { margin-top: 22px; background:var(--accent); color:#fff; border:none;
             border-radius:8px; padding:10px 18px; font-weight:600; cursor:pointer; }
    #saved { color: var(--green); margin-left: 12px; opacity: 0; transition: opacity .2s; }
    #saved.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Distraction LeetCode Gate</h1>
    <p class="sub">Pick the sites that should cost you a LeetCode problem.</p>

    <label for="domains">Blocked sites <span class="hint">— one per line. Paste any URL; it's trimmed to the domain.</span></label>
    <textarea id="domains" spellcheck="false" placeholder="reddit.com&#10;instagram.com&#10;x.com&#10;news.ycombinator.com"></textarea>

    <label for="minutes">Unlock window <span class="hint">— minutes of access per solved problem</span></label>
    <div class="row"><input id="minutes" type="number" min="1" max="240" /></div>

    <div class="row">
      <button id="save">Save</button>
      <span id="saved">Saved ✓</span>
    </div>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
